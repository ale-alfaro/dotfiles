# This file sources other files in `hyprland` and `custom` folders
# You wanna add your stuff in files in `custom`
# Defaults
source=~/.config/hypr/hyprland/env.conf
source=~/.config/hypr/hyprland/autostart.conf
source=~/.config/hypr/hyprland/aesthetics.conf
source=~/.config/hypr/hyprland/rules.conf
source=~/.config/hypr/hyprland/bindings.conf
source=~/.config/hypr/hyprland/input.conf

# Machine-specific config (laptop only — leave empty/absent on desktop)
source=~/.config/hypr/machine.conf
