#
# Application bindings
$terminal = uwsm app -- wezterm -e
$ghostty_terminal = uwsm app -- ghostty -e zsh -l
bindd = SUPER, return, Terminal, exec, $terminal --cwd "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, return, Terminal(backup), exec, uwsm app -- alacritty --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, return, Terminal(Ghostty), exec, $ghostty_terminal
# $browser = uwsm app -- zen-browser
$browser = omarchy-launch-browser
$webapp = $browser --app
$img_viewer = uwsm app -- imv

# bindd = SUPER, return, Terminal, esupported and only actions are supported. Use `open -na Ghostty.app`xec, $terminal
bindd = SUPER, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser, exec, uwsm-app -- chromium
bindd = SUPER, N, Neovim, exec, $terminal nvim
bindd = SUPER, T, Activity, exec, $terminal btop
bindd = SUPER, O, Obsidian, exec, omarchy-launch-or-focus "^obsidian$" "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER, P, Passwords, exec, uwsm app -- bitwarden-desktop
bindd = SUPER ,S, Slack, exec, omarchy-launch-or-focus signal "uwsm-app -- slack-desktop"


# Menus
bindd = SUPER, SPACE, Launch apps, exec, walker -p "Start…"
bindd = SUPER ALT, SPACE, Omarchy menu, exec, omarchy-menu
bindd = SUPER, ESCAPE, Power menu, exec, omarchy-menu system
bindd = SUPER ALT, P, Show password menu, exec, omarchy-bw-menu

# Keybinds and keyboard layout cheatsheet
bindd = SUPER , K, Show keyboard layout, exec, $img_viewer /home/alealfaro/dotfiles/common/zmk-config/artifacts/corne.svg
bindd = SUPER ALT, K, Show key bindings, exec, omarchy-menu-keybindings

bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://calendar.google.com/calendar"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://gmail.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"

source = ~/.config/hypr/hyprland/keybindings/media.conf
source = ~/.config/hypr/hyprland/keybindings/tiling.conf
##! Utilities
# Screenshot, Record, OCR, Color picker, Clipboard history
bindd = CTRL SHIFT, 4, Take a screenshot of a region, exec, hyprshot -m region --freeze -o /home/alealfaro/Pictures/Screenshots
bindd = SUPER SHIFT, v, Copy clipboard history entry, exec, walker -m clipboard

# Aesthetics
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, pkill -SIGUSR1 waybar
bindd = SUPER CTRL, SPACE, Next background in theme, exec, omarchy-theme-bg-next
bindd = SUPER SHIFT CTRL, SPACE, Pick new theme, exec, omarchy-menu theme

# Notifications
bindd = SUPER, COMMA, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all
bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, makoctl mode -t do-not-disturb && makoctl mode | grep -q 'do-not-disturb' && notify-send "Silenced notifications" || notify-send "Enabled notifications"


# Toggle nightlight
bindd = SUPER CTRL, N, Toggle nightlight, exec, omarchy-toggle-nightlight

# Screenshots
bindd = , PRINT, Screenshot of region, exec, omarchy-cmd-screenshot
bindd = SHIFT, PRINT, Screenshot of window, exec, omarchy-cmd-screenshot window
bindd = CTRL, PRINT, Screenshot of display, exec, omarchy-cmd-screenshot output

# Screen recordings
bindd = ALT, PRINT, Screen record a region, exec, omarchy-cmd-screenrecord
bindd = CTRL ALT, PRINT, Screen record display, exec, omarchy-cmd-screenrecord output

#Copy/Paste
bindd = SUPER, C, Copy, sendshortcut, CTRL, Insert,
bindd = SUPER, V, Paste, sendshortcut, SHIFT, Insert,
bindd = SUPER, X, Cut, sendshortcut, CTRL, X,
bindd = SUPER CTRL, V, Clipboard, exec, omarchy-launch-walker -m clipboard


# File sharing
bindd = SUPER CTRL, S, Share, exec, omarchy-menu share
