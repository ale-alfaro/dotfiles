#
# Application bindings
$img_viewer = uwsm app -- firefox

# bindd = SUPER, return, Terminal, esupported and only actions are supported. Use `open -na Ghostty.app`xec, $terminal
################################################### Essential Apps ###################################################################
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
bindd = SUPER, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER, Z, Zen-Browser, exec, omarchy-launch-browser
bindd = SUPER , B, BTOP, exec, omarchy-launch-tui btop
bindd = SUPER, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER, SLASH, Passwords, exec, uwsm app -- bitwarden-desktop
bindd = SUPER , C, Calculator, exec, gnome-calculator

################################################### Web Apps###################################################################
bindd = SUPER , M, Meeting Calendar, exec, omarchy-launch-webapp "https://calendar.google.com/calendar"
bindd = SUPER , E, Email, exec, omarchy-launch-webapp "https://gmail.com"
bindd = SUPER , Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER , A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com/"
bindd = SUPER , G, Github, exec, omarchy-launch-webapp "https://github.com/"


# Menus
################################################### Menus ###################################################################
bindd = SUPER, SPACE, Launch apps, exec, walker -p "Start…"
bindd = SUPER ALT, SPACE, Omarchy menu, exec, omarchy-menu
bindd = SUPER, ESCAPE, Power menu, exec, omarchy-menu system
bindld = , XF86PowerOff, Power menu, exec, omarchy-menu system
bindd = SUPER, K, Show key bindings, exec, omarchy-menu-keybindings
################################################### Media Control ###################################################################
bindd = SUPER CTRL, A, Audio controls, exec, omarchy-launch-audio
bindd = SUPER CTRL, B, Bluetooth controls, exec, omarchy-launch-bluetooth
bindd = SUPER CTRL, W, Wifi controls, exec, omarchy-launch-wifi
bindd = SUPER CTRL, N, Toggle nightlight, exec, omarchy-toggle-nightlight

# Keybinds and keyboard layout cheatsheet
################################################### Tiling ###################################################################
bindd = SUPER SHIFT, K, Show keyboard layout, exec, $img_viewer /home/alealfaro/dotfiles/common/zmk-config/artifacts/corne.svg

# Aesthetics
################################################### Topbar and themes ###################################################################
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, pkill -SIGUSR1 waybar
bindd = SUPER CTRL, SPACE, Next background in theme, exec, omarchy-theme-bg-next
bindd = SUPER SHIFT CTRL, SPACE, Pick new theme, exec, omarchy-menu theme

# Notifications
################################################### Notifications ###################################################################
bindd = SUPER, N, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER SHIFT, N, Dismiss all notifications, exec, makoctl dismiss --all
bindd = SUPER ALT, N, Toggle silencing notifications, exec, makoctl mode -t do-not-disturb && makoctl mode | grep -q 'do-not-disturb' && notify-send "Silenced notifications" || notify-send "Enabled notifications"

################################################### Screenshots and Screenrecording ###################################################################
# bindd = CTRL SHIFT, S, Take a screenshot of a region, exec, hyprshot -m region --freeze -o /home/alealfaro/Pictures/Screenshots
bindd = SUPER , R, Screenrecording, exec, omarchy-menu screenrecord

bindd = SUPER, S, Screenshot to clipboard, exec, omarchy-cmd-screenshot smart clipboard
bindd = SUPER ALT, S, Screenshot with editing, exec, omarchy-cmd-screenshot
bindd = SUPER SHIFT, S, OCR Screenshot, exec, ~/dotfiles/linux/bin/better-screenshot region ocr

################################################### File sharing ###################################################################
bindd = SUPER CTRL, S, Share, exec, omarchy-menu share
bindd = SUPER, L, Localsend, exec, omarchy-launch-or-focus localsend

################################################### Waybar-less information###################################################################
bindd = SUPER CTRL ALT, T, Show time, exec, notify-send "    $(date +"%A %H:%M  —  %d %B W%V %Y")"
bindd = SUPER CTRL ALT, B, Show battery remaining, exec, notify-send "󰁹    Battery is at $(omarchy-battery-remaining)%"


################################################### Dictation ###################################################################
bindd = SUPER , D, Start dictation, exec, voxtype record toggle

################################################### Zoom ###################################################################
bindd = SUPER CTRL, Z, Zoom in, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')
bindd = SUPER CTRL ALT, Z, Reset zoom, exec, hyprctl keyword cursor:zoom_factor 1
################################################### Clipboard  ###################################################################
bindd = SUPER, C, Copy, sendshortcut, CTRL, Insert,
bindd = SUPER, V, Paste, sendshortcut, SHIFT, Insert,
bindd = SUPER, X, Cut, sendshortcut, CTRL, X,
bindd = SUPER SHIFT, V, Clipboard, exec, omarchy-launch-walker -m clipboard

################################################### Tiling ###################################################################
# Move focus with SUPER + arrow keys
#/# bind = Super+Shift, ←/↑/→/↓,, # Move in direction
bindd = SUPER, LEFT, Move window focus left, movefocus, l
bindd = SUPER, RIGHT, Move window focus right, movefocus, r
bindd = SUPER, UP, Move window focus up, movefocus, u
bindd = SUPER, DOWN, Move window focus down, movefocus, d
bindd = SUPER, W, Close active window, killactive,
bindd = CTRL ALT, DELETE, Close all Windows, exec, omarchy-cmd-close-all-windows

bindd = SUPER, TAB, Next workspace, workspace, e+1
bindd = SUPER SHIFT, TAB, Previous workspace, workspace, e-1
bindd = ALT, Tab, Cycle to next window, cyclenext
bindd = ALT, Tab, Reveal active window on top, bringactivetotop
bindd = ALT SHIFT, Tab, Cycle to prev window, cyclenext, prev
bindd = ALT SHIFT, Tab, Reveal active window on top, bringactivetotop
################################################### Resize###################################################################
# Resize active window
bindd = SUPER, minus, Expand window left, resizeactive, -100 0
bindd = SUPER, equal, Shrink window left, resizeactive, 100 0
bindd = SUPER SHIFT, minus, Shrink window up, resizeactive, 0 -100
bindd = SUPER SHIFT, equal, Expand window down, resizeactive, 0 100

################################################### Mouse Tiling ###################################################################
# Scroll through existing workspaces with SUPER + scroll
bindd = SUPER, mouse_down, Scroll active workspace forward, workspace, e+1
bindd = SUPER, mouse_up, Scroll active workspace backward, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmd = SUPER, mouse:272, Move window, movewindow
bindmd = SUPER, mouse:273, Resize window, resizewindow
################################################### Other Tiling ###################################################################
bindd = SUPER ALT, J, Toggle split, togglesplit, # dwindle
bindd = SUPER ALT, V, Toggle floating, togglefloating,

# Swap active window with the one next to it with SUPER + SHIFT + arrow keys
bindd = SUPER SHIFT, LEFT, Swap window to the left, swapwindow, l
bindd = SUPER SHIFT, RIGHT, Swap window to the right, swapwindow, r
bindd = SUPER SHIFT, UP, Swap window up, swapwindow, u
bindd = SUPER SHIFT, DOWN, Swap window down, swapwindow, d



# Switch workspaces with SUPER + [0-9]
bindd = SUPER, code:10, Switch to workspace 1, workspace, 1
bindd = SUPER, code:10, Focus monitor of workspace 1, focusmonitor, l
bindd = SUPER, code:11, Switch to workspace 2, workspace, 2
bindd = SUPER, code:11, Focus monitor of workspace 2, focusmonitor, l
bindd = SUPER, code:12, Switch to workspace 3, workspace, 3
bindd = SUPER, code:12, Focus monitor of workspace 3, focusmonitor, l
bindd = SUPER, code:13, Switch to workspace 4, workspace, 4
bindd = SUPER, code:13, Focus monitor of workspace 4, focusmonitor, l
bindd = SUPER, code:14, Switch to workspace 5, workspace, 5
bindd = SUPER, code:14, Focus monitor of workspace 5, focusmonitor, l

bindd = SUPER, code:15, Switch to workspace 6, workspace, 6
bindd = SUPER, code:15, Focus monitor of workspace 6, focusmonitor, r
bindd = SUPER, code:16, Switch to workspace 7, workspace, 7
bindd = SUPER, code:16, Focus monitor of workspace 7, focusmonitor, r
bindd = SUPER, code:17, Switch to workspace 8, workspace, 8
bindd = SUPER, code:17, Focus monitor of workspace 8, focusmonitor, r

# Move active window to a workspace with SUPER + SHIFT + [0-9]
bindd = SUPER SHIFT, code:10, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, code:10, Movw window to monitor of workspace 1, movewindow, l
bindd = SUPER SHIFT, code:11, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, code:11, Movw window to monitor of workspace 2, movewindow, l
bindd = SUPER SHIFT, code:12, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, code:12, Movw window to monitor of workspace 3, movewindow, l
bindd = SUPER SHIFT, code:13, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, code:13, Movw window to monitor of workspace 4, movewindow, l
bindd = SUPER SHIFT, code:14, Move window to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, code:14, Movw window to monitor of workspace 5, movewindow, l


bindd = SUPER SHIFT, code:17, Move window to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, code:15, Movw window to monitor of workspace 6, movewindow, r
bindd = SUPER SHIFT, code:16, Move window to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, code:15, Movw window to monitor of workspace 7, movewindow, r
bindd = SUPER SHIFT, code:17, Move window to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, code:15, Movw window to monitor of workspace 8, movewindow, r
