# Laptop-specific configuration
# Only source this file on laptop machines

env = GDK_SCALE,1.5
# Monitor for laptop
monitorv2 {
  output = eDP-1,
  mode = preferred
  position = auto-left
  scale = auto
}
# Additional monitor for laptop
monitorv2 {
  output = HDMI-A-1
  mode = preferred
  position = auto-right
  scale = auto
}

workspace = 1,monitor:eDP-1,rounding:true,decorate:true,gapsin:1,gapsout:8
workspace = 2,monitor:eDP-1,rounding:true,decorate:true,gapsin:1,gapsout:8
workspace = 3,monitor:eDP-1,rounding:true,decorate:true,gapsin:1,gapsout:8
workspace = 4,monitor:HDMI-A-1,rounding:true,decorate:true,gapsin:0,gapsout:0
workspace = 5,monitor:HDMI-A-1,rounding:true,decorate:true,gapsin:0,gapsout:0
workspace = 6,monitor:HDMI-A-1,rounding:true,decorate:true,gapsin:0,gapsout:0
# VRR (variable refresh rate) for built-in display
monitor=,preferred,auto,auto,vrr,1

# Faster key repeat start (lower = snappier)
input {
  repeat_delay = 250
}

# Toggle laptop display (e.g. when using external monitor only)
bindd = SUPER CTRL, Delete, Toggle laptop display, exec, omarchy-hyprland-monitor-internal-toggle

# Power profile boost on startup
exec-once = omarchy-powerprofiles-init
