# Good compromise for 27" or 32" 4K monitors (but fractional!)
# env = GDK_SCALE,1.75
# monitor=,preferred,auto,1.666667

# Straight 1x setup for low-resolution displays like 1080p or 1440p
# env = GDK_SCALE,1
# monitor=,preferred,auto,1

# Example for Framework 13 w/ 6K XDR Apple display
# monitor = DP-5, 6016x3384@60, auto, 2
# monitor = eDP-1, 2880x1920@120, auto, 2
env = GDK_SCALE,1.5
# Monitor for laptop
monitorv2 {
  output = eDP-1,
  mode = preferred
  position = auto-left
  scale = auto
}
# Additional monitor for laptop
monitorv2 {
  output = HDMI-A-1
  mode = preferred
  position = auto-right
  scale = auto
}

workspace = 1,monitor:eDP-1,rounding:true,decorate:true,gapsin:1,gapsout:8
workspace = 2,monitor:eDP-1,rounding:true,decorate:true,gapsin:1,gapsout:8
workspace = 3,monitor:eDP-1,rounding:true,decorate:true,gapsin:1,gapsout:8
workspace = 4,monitor:HDMI-A-1,rounding:true,decorate:true,gapsin:0,gapsout:0
workspace = 5,monitor:HDMI-A-1,rounding:true,decorate:true,gapsin:0,gapsout:0
workspace = 6,monitor:HDMI-A-1,rounding:true,decorate:true,gapsin:0,gapsout:0
