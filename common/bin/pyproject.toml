[project]
name = "binutils"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "cattrs>=25.3.0",
    "cyclopts>=4.4.6",
    "dotenv>=0.9.9",
    "kconfiglib==14.1.1a4",
    "west>=1.5.0",
]

[tool.pyrefly]
site-package-path = [".venv/lib/python3.14/site-packages"]
skip-interpreter-query = true
python-platform = "linux"
python-version = "3.14"


