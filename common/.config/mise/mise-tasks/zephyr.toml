
[diffconfig]
description = "Diffconfig after menucfg"
dir = "{{cwd}}"
usage = '''
arg "[app]" help="Application" default="app" env="ZEPHYR_APP"
flag "-d --domain [domain]" help="Domain"
flag "-m --merge" help="Merge style"
flag "-o --out <out>" help="Output to file"
'''
run = '''
#!/usr/bin/env zsh

build_dir="build_${usage_app?}/${usage_domain:-$usage_app}"
diffconfig.py "${build_dir}/zephyr/.config.old" "${build_dir}/zephyr/.config" \
    ${usage_merge:+-m} \
    ${(z)${usage_out:+-o $usage_out}}
'''


[select_board]
description = "West configure the workspace for building the application"
usage = '''
flag "-r --regex [regex]" {
    help "Regex for board name to filter boards"
}
'''
run = '''
    board=$(west boards ${(z)${usage_board_regex:+-n $usage_regex}} -f "{name} {dir}" \
        | fzf \
            --ansi \
            --preview='tree -C {2}' \
            --preview-window='45%,border-sharp' \
            --prompt='Boards > ' \
            --accept-nth 1 \
            --with-nth 1)
[[ -z ${board:-} ]] && echo "No board selected, exiting" && return 0
echo "Selected board: ${board?}"
west config build.board "${board?}"
'''
