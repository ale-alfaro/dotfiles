

[env]
ARM_GDB_PY = "/opt/zephyr-sdk-custom/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb-py"

[shell_alias]
pygdb = "/opt/zephyr-sdk-custom/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb-py -ex 'target remote :2331'"
jdbserver = "JLinkGDBServer -device NRF52840_XXAA  -if SWD -speed 4000 -port 2331 -silent -singlerun"


[tools]
uv = "latest"
python = "3.13"
cmake = "latest"
"pipx:cmakelang" = { version = "latest", extras = "yaml,html-gen" }
"pipx:west" = "latest"
"pipx:dtsh" = "latest"
"npm:devicetree-language-server" = "latest"
"npm:dts-linter" = "latest"
"pipx:CodeChecker" = "latest"
"pipx:pylink-square" = "latest"
"pipx:kconfigstyle" = "latest"
"pipx:prek" = "latest"
"cargo:run-clang-format" = "latest"
"cargo:run-clang-tidy" = "latest"

[tools."http:nrfutil"]
version = "latest"

[tools."http:nrfutil".platforms]
macos-x64 = { url = "https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/aarch64-apple-darwin/nrfutil" }
macos-arm64 = { url = "https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/universal-apple-darwin/nrfutil" }
linux-x64 = { url = "https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/x86_64-unknown-linux-gnu/nrfutil" }

[prepare.uv]
auto = true # Auto-run before mise x/run

[task_templates."build:config"]
description = "Configure West workspace"
usage = '''
flag "-p --pristine <value>" {
  choices "always" "auto" "never"
  default "auto"
  help "Target"
}
flag "-b --board <board>" help="Board" env="BOARD"
flag "--no-sysbuild" help="No Sysbuild"
'''
run = '''
west config build.dir-fmt  build_{app}
west config build.sysbuild ${${usage_no_sysbuild:+false}:-true}
west config build.pristine ${usage_pristine?}
[[ ! -z ${usage_board:-} ]] && west config build.board ${usage_board?}
print "CONFIG SET TO:"
west config -l
'''


[task_templates."west:build"]
dir = "{{cwd}}"
description = "Build a zephyr app with west"
usage = '''
arg "<app>" help="App to build" env="ZEPHYR_APP"
flag "-b --board <board>"  {
    help "Board to run sample on"
    env "BOARD"
}
flag "-t --target <target>" {
  help "Build target. Use `mise run west:targets` to discover available targets"
}
flag "-d --domain <domain>" {
  help "Domain for build target"
  default "app"
}
flag "-c --clean" help="Clean"
flag "-o --out <out>" {
    help "Build directory name where to output the files when doing a clean rebuild"
}
flag "--debug" help="Debug build"
arg "[cmake_opts]" var=#true
'''
run = '''
#!/usr/bin/env zsh
set -euxo pipefail
# Sysbuild-level targets (no --domain, run at top level)
typeset -a sysbuild_targets=(
  sysbuild_menuconfig sysbuild_guiconfig
  partition_manager partition_manager_report all pristine
)
typeset -a west_cmd_targets=(
    flash debug attach debugserver
)
# Domain-specific targets (need --domain=app|mcuboot)
typeset -a domain_targets=(
    menuconfig guiconfig hardenconfig
    rom_report ram_report footprint
    initlevels report config-twister dtsh
)

app_name="${usage_app:t}"
build_dir="build_${app_name}"
target="${usage_target:-}"
if [[ -d ${build_dir?} && -n ${target} ]]; then
    (( ${west_cmd_targets[(Ie)$target]} )) && print -v cmd "west ${target} -d ${build_dir?}"
    (( ${sysbuild_targets[(Ie)$target]} )) && print -v cmd "west build -t ${target} --pristine=never ${usage_app?}"
    (( ${domain_targets[(Ie)$target]} )) && print -v cmd "west build --domain=${domain:-$app_name} -t ${target} --pristine=never ${usage_app?}"

    if [[ ! -z ${cmd:-} ]]; then
        echo "→ Running build target cmd: ${cmd?} "
        eval "${cmd}"
        return 0
    else
        echo "ERROR: Couldn' create command based on target ${target?}"
        exit 1
    fi
fi
eval "usage_cmake_args=(${usage_cmake_opts:-})"
[[ ! -z ${usage_debug:-} ]] && usage_cmake_args+="${app_name}_SNIPPET=sibel-debug"
# Deploy services
if [[ -n "${usage_cmake_args?}" ]]; then
    for arg in ${usage_cmake_args?}; do
        cmake_args+=" -D${arg?}"
    done
fi

[[ -z ${usage_board:-} ]] && print -v board "$(west config build.board 2>1)" || print -v board "${usage_board?}"

outdir="${usage_out:-${build_dir?}}"
cmd=$(cat <<EOF
west build \
${=${usage_board:+-b ${usage_board?}}} \
${usage_app?} \
${(z)${usage_out:+-d ${usage_out?}}} \
${usage_clean:+-p} \
${(z)${cmake_args:+-- ${cmake_args[@]}}}
EOF
)
echo "Running build cmd $cmd"
eval "$cmd"
echo "Successfull build. Output files written to ${outdir?}"
[[ -d  ${outdir?} ]] && west config build.curr-bdir ${outdir?}
'''

[task_templates."west:targets"]
dir = "{{cwd}}"
description = "List available build targets by domain"
usage = '''
flag "-d --domain <domain>" {
  choices "sysbuild" "app" "mcuboot" "smp_svr"
  default "sysbuild"
  help "Image domain to list targets for"
}
'''
run = '''
#!/usr/bin/env zsh
build_dir="$(west config build.curr-bdir 2>/dev/null || echo build_${ZEPHYR_APP:-app})"
case ${usage_domain} in
  sysbuild)  dir="${build_dir}" ;;
  *)         dir="${build_dir}/${usage_domain}" ;;
esac
if [[ ! -d "${dir}" ]]; then
  echo "Build directory '${dir}' does not exist. Run a build first."
  exit 1
fi
echo "Available targets in ${usage_domain} (${dir}):"
ninja -C "${dir}" -t targets 2>/dev/null \
  | rg -N ': phony' \
  | sed 's/: phony//' \
  | sort \
  | rg -v '^_|CMakeFiles|prefix|stamp|cmake_install|rebuild_cache|edit_cache|modules/' \
  | column
'''

[task_templates."west:flash"]
dir = "{{cwd}}"
description = "Flash"
usage = '''
arg "<app>" help="App to build" env="ZEPHYR_APP"
flag "-c --context" help="Get runner's context info"
flag "-e --erase" help="Do full erase"
flag "--rtt" help="Connect to device RTT console after flashing"
'''
run = '''
build_dir="build_${usage_app:t}"
[[ ! -z ${usage_erase:-} ]] && runner_flags="--erase"
[[ ! -d "${build_dir}" ]] && echo "Directory ${build_dir} doesnt exist" && exit 1
if [[ ! -z ${usage_context:-} ]]; then
  west flash -d ${build_dir}   -H -r ${usage_runner?}
else
  echo "Flashing Device"
  west flash -d ${build_dir?} ${runner_flags:-} --reset
  if [[ ! -z ${usage_rtt:-} ]]; then
    echo "Connecting to RTT in 3 seconds"
    sleep 3
    west rtt -d ${build_dir?}
  fi
fi
'''

[task_templates."west:debug"]
description = "Debug"
env = {_.path = "/opt/zephyr-sdk-custom/arm-zephyr-eabi/bin"}
dir = "{{cwd}}"
usage = '''
arg "[app]" help="Application" env="ZEPHYR_APP"
flag "-d --domain [domain]" help="Domain"
'''
run = '''
app_name=${usage_app:t}
west attach --gdb ${ARM_GDB_PY?} --domain ${usage_domain:-$app_name} -d "build_${app_name}"
'''




[task_templates."sca:run"]
description = "Run static analysis via Zephyr SCA"
usage = '''
arg "[sca]"  {
  choices "gcc" "clang" "codechecker" "coverity" "eclair" "polyspace" "cpptest"
  env "ZEPHYR_SCA"
  help "Static code analyis tool to run"
}
'''
run = '''
west build --pristine=always -- -DZEPHYR_SCA_VARIANT=${usage_sca?}
'''


[task_templates."test:run"]
description = "Run Zephyr twister test runner (use -- to pass twister flags)"
usage = '''
arg "[test_dir]" help="Test application directory" env="TWISTER_TEST_DIR"
flag "-b --board <board>" help="Board to test with. Will be used as the platform in Twister" env="BOARD"
flag "-s --sim <sim>" help="Simlator type to test, if none specified simulation will be used" {
    choices "mdb-nsim" "nsim" "renode" "qemu" "tsim" "armfvp" "xt-sim" "native" "custom" "simics"
    default "native"
}
arg "<twister_args>" help="Twister arguments" env="TWISTER_ARGS" var=#true double_dash="required"
'''
run = '''
eval "test_args=($usage_twister_args)"
echo "Running twister test suite at $PWD and test_root ${usage_test_dir?}"

if [[ -z ${usage_board:-}  ]]; then
    echo "Emulation Test!"
    platform_flags=("--emulation-only" --simulation ${usage_sim?})
else
    echo "Hardware Test!"
    west_flash_flags='--west-flash="--erase"'
    platform_flags=('--device-testing' '-p' ${usage_board?} ${(z)west_flash_flags})
fi
test_dir="${usage_test_dir?}"
test_dir_name=${test_dir:t}
west twister -T  ${test_dir?} --test-tree
west twister -T ${test_dir?} --list-tags
cmd=$(cat <<EOF
west twister \
-T ${usage_test_dir?} \
${(z)platform_flags[@]} \
--clobber-output -o twister_${test_dir_name?} --inline-logs
EOF
)
echo "Running build cmd $cmd"
eval "$cmd"
'''


