

["_stow:dotfiles"]
hide = true
dir = "{{cwd}}"
usage = '''
arg "[target]" {
  help "Target"
  default "{{xdg_config_home}}"
}
flag "-y --yes" {
  help "Perform simulated operation instead of doing it"
  global #true
  env "STOW_NO_SIM"
}
'''
run = '''
stow \
  {% if usage.yes %}-v{% else %}--simulate -vv{% endif %} \
  --target {{ usage.target }} \
  -R .
'''

["global:stow:doftiles"]
description = "Stow dotfiles"
dir = '{{ env.HOME }}/dotfiles/common/.config'
env = { STOW_NO_SIM = "1" }
confirm = 'Do you want to stow {{exec(command="eza --oneline --all" ~ " ~/dotfiles/common/.config")}}'
run = '''
mise run _stow:dotfiles
echo "XDG_CONFIG_HOME: "
eza --icons=always --oneline \
    --no-git --all \
    {{ xdg_config_home }}
'''

["sysadmin:backup:hard-drive"]
description = "Backup system to hard drive"
confirm = "Is the hard drive plugged in and visible through `lsblk`?"
run = '''
sudo mount /mnt/backup 
sudo btrbk run 
sudo umount /mnt/backup
'''


["global:pacman:orphans"]
hide = true
usage = '''
flag "-d --delete"
'''
run = '''
echo 'Orphans:'
pacman -Qdttq
{% if usage.delete %}
pacman -Qdttq | sudo pacman -Rns -
{% endif %}
'''

["utils:defuddle"]
description = "Markdown to HTML"
dir = "{{cwd}}"
usage = '''
arg "<src>" help="Regex to use for HTML finding"
arg "-o [out]" help="Path where to search" default="."
'''
run = '''
defuddle parse --md {{usage.src}} {% if usage.out %}-o {{usage.out}}{% endif %}
'''

["utils:mermaid:export"]
tools = { "go:github.com/coolamit/mermaid-cli/cmd/mmd-cli" = "latest", "npm:puppeteer" = { version = "latest", postinstall = "puppeteer browsers install chrome-headless-shell" } }
dir = "{{cwd}}"
usage = '''
arg "<file>" {
        help "Markdown file"
}
flag "-f --format [format]" {
        help "output format"
        choices "svg" "png" "pdf"
        default "pdf"
}
flag "-o --out [dir]" {
        help "Output dir"
        default "assets"
}
'''
run = 'mmd-cli -i {{usage.file}} -a ./{{usage.assets}} {% if usage.format is matching "pdf" %}--pdfFit{% endif %} --outputFormat {{usage.format}}'
