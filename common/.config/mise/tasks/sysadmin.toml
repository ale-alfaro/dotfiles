

["_stow:dotfiles"]
hide = true
dir = "{{env.HOME}}/dotfiles"
usage = '''
arg "<pkg>" help="Package types to stow" {
  choices "common" "linux"
  default "commoh"
}
flag "-y --yes" help="Perform simulated operation instead of doing it" {
  global #true
  env "STOW_NO_SIM"
}
'''
run = '''
stow \
  {% if usage.yes %}-v{% else %}--simulate -vv{% endif %} \
  -d {{ env.HOME }}/dotfiles/{{usage.pkg}}/.config \
  -t {{ xdg_config_home }} \
  -R .
'''

["global:stow:doftiles"]
description = "Stow dotfiles"
depends = ["_stow:dotfiles common", "_stow:dotfiles linux"]
run = '''
echo "XDG_CONFIG_HOME: "
eza --icons=always --oneline \
    --no-git --all \
    {{ xdg_config_home }}
'''


["global:pacman:orphans"]
hide = true
usage = '''
flag "-d --delete"
'''
run = '''
echo 'Orphans:'
pacman -Qdttq
{% if usage.delete %}
pacman -Qdttq | sudo pacman -Rns -
{% endif %}
'''

["global:udev-rules:install"]
hide = true
usage = '''
arg "<rules_file>"
'''
run = '''
sudo cp {{ usage.rules_file }} /etc/udev/rules.d/
sudo udevadm control --reload
'''
