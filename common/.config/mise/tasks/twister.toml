
["twister:find_tests"]
description = "List samples"
tools = { 'yq' = 'latest' }
dir = "{{cwd}}"
run = '''
#!/bin/zsh
fd --strip-cwd-prefix -e yaml -tf '(testcase|sample)\.yaml' \
    -x echo -e \; \
    -x yq e -o tsv '(.tests | with_entries(.key |= "{//}/\(.)") | keys)' '{}'

'''
["twister:list"]
description = "List every twister-discoverable test."
dir = "{{cwd}}"
usage = 'arg "[dir]" help="test directory" default="."'
run = '''
west twister \
  -T {{usage.dir}} \
  --list-tests \
  {{ vars.COMMON_TWISTER_FLAGS | default(value=['-v','-i','--no-clean']) | join(sep=' ') }}
'''

["twister:tree"]
description = "Print the twister test tree (suites + their cases)."
dir = "{{cwd}}"
usage = 'arg "[dir]" help="test directory" default="."'
run = '''
west twister \
  -T {{usage.dir}} \
  --test-tree 
  {{ vars.COMMON_TWISTER_FLAGS | default(value=['-v','-i','--no-clean']) | join(sep=' ') }}
'''

# Available log levels for twister: NOTSET,DEBUG,INFO,WARNING,ERROR,CRITICAL

["twister:test:sim"]
description = "Run test with native sim"
dir = "{{cwd}}"
usage = '''
arg "<test>" help="Twister test to run"
flag "-v --verbose" help="Verbosity" {
  count #true
}
arg "[varopts]"  help="Options to pass to twister" {
  var #true
}
'''
run = '''
local -a verbose_flags
local -a flags
verbose_flags=('-ll WARNING -v' '-ll INFO -vv' '-ll DEBUG -vvv')
eval "varopts=(${usage_varopts:-})"
flags=('--no-clean')
if (( usage_verbose >= 1 && usage_verbose < 4 )); then
  flags+=("${verbose_flags[$usage_verbose]}" '-i')
fi
if [[ ${#varopts} > 0 ]]; then
  flags+=("${varopts[@]}")
fi
west twister \
  -T "${usage_test?}" \
  -p native_sim/sim \
  "$flags"
'''


["twister:debug:logs"]
description = "Run tests with debug logs"
dir = "{{cwd}}"
usage = '''
arg "<dir>" help="test directory"
arg "<platform>" help="test platform"
'''
run = '''
west twister \
    -T {{usage.dir }} \
    -p {{usage.platform}} \
    -ll DEBUG \
    -vv -i \
    --no-clean
'''

["twister:test:cov"]
description = "Run tests on with coverage (gcovr)."
dir = "{{cwd}}"
usage = '''
arg "<dir>" help="test directory"
arg "<platform>" help="test platform"
'''
run = '''
west twister \
    {{vars.twister_common_flags | default(value='-v -i --no-clean') }} \
    -T {{usage.dir }} \
    -p {{usage.platform}} \
    --enable-coverage \
    --coverage-tool gcovr
'''

# ============================================================================
# On-hardware (target board)
# ============================================================================
["twister:test:hw"]
description = "Run tests on HW"
dir = "{{cwd}}"
usage = '''
arg "<dir>" help="test directory"
arg "<platform>" help="test platform"
'''
run = '''
west twister \
{{vars.twister_common_flags | default(value=['-v', '-i', '--no-clean']) | join(sep=' ') }} \
-T {{usage.dir}} \
-p {{usage.platform}} \
--device-testing \
--west-runner="nrfutil" \
--device-serial="{{vars.SERIAL_PORT | default(value='/dev/ttyACM0') }}" \
--device-flash-with-test --device-flash-timeout=15
'''
["twister:test:size_report"]
description = "Build sh_sdk tests for the aria board and produce ROM/RAM + footprint reports."
dir = "{{cwd}}"
usage = '''
arg "<dir>" help="test directory"
arg "<platform>" help="test platform"
'''
run = '''
west twister \
    {{vars.twister_common_flags | default(value='-v -i --no-clean') }} \
    -T {{usage.dir }} \
    -p {{usage.platform}} \
    --create-rom-ram-report --enable-size-report
'''


