
["preproc:list"]
description = "List preprocessor definitions in file"
dir = "{{cwd}}"
usage = '''
arg "<file>" help="File"
'''
run = '''
unifdef -s {{usage.file}}
'''
["preproc:remove:diff"]
description = "Remove preprocessor definitions"
dir = "{{cwd}}"
usage = '''
arg "<file>" help="File"
arg "<syms>" var=#true var_min=1
flag "-i --in-place" help="In place"
flag "-u --undef" help="Symbols are undefined"
'''
run = '''
file="${usage_file?}"
eval "symbols=( ${usage_syms?} )"
local -a cmd
cmd=(unifdef '-x1')
for sym in "${symbols[@]}"; do
   cmd+=("-${${usage_undef:+U}:-D}CONFIG_${sym}")
done
eval "${cmd[@]} $file | difft $file -"
if [[ "${usage_in_place:-}" ]]; then
  eval "${cmd[@]} -m $file"
fi
'''
["preproc:search"]
description = "Search preprocessor definitions"
dir = "{{cwd}}"
usage = '''
arg "<sym>" help="Symbol"
flag "-d --dir [dir]" help="Dir" {
  default "."
}
flag "-i --in-place" help="In place"
flag "-u --undef" help="Symbols are undefined"
'''
run = '''
{% if usage.undef %}
  {% set prefix = "-U" %}
{% else %}
  {% set prefix = "-D" %}
{% endif %}
{% set unifdef_flag = "" %}
{% if usage.in_place %}
  rg '{{usage.sym}}' {{ usage.dir }} -tc -tcpp -th --line-buffered --files-with-matches | xargs -I '{}' unifdef -x1 -m '{{prefix ~ usage.sym}}' '{}'
{% else %}
  rg '{{usage.sym}}' {{ usage.dir }} -tc -tcpp -th --line-buffered --files-with-matches | xargs -I '{}' --max-args=1 sh -c "unifdef '{{prefix ~ usage.sym}}' '{}' | difft '{}' - "
{% endif %}
'''


["preproc:stats"]
description = "Stats on usage of macros"
dir = "{{cwd}}"
usage = '''
arg "<dir>"
'''
run = '''
fd . {{usage.dir}} -e cpp -e h -e c -x sh -c 'unifdef -s "$1" | sed "s|^|$1\t|"' _ '{}' \
  | grep -P '\tCONFIG_' \
  | sort -t$'\t' -k2,2 -k1,1 > macro-usage.tsv
cut -f2 macro-usage.tsv | uniq -c | sort -rn | while read -r count macro; do
  printf '%s  (%d uses)\n' "$macro" "$count"
  awk -F'\t' -v m="$macro" '$2==m {print "    "$1}' macro-usage.tsv | sort -u
done
'''
