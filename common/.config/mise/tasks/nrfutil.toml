["_artifacts:mergehex"]
description = "Merge mcuboot and app hex"
hide = true
dir = "{{cwd}}"
usage = 'arg "<build>" help="build dir"'
run = '''
uv run {{env.ZEPHYR_BASE | default(value='zephyr')}}/scripts/build/mergehex.py {{usage.build}}/**/zephyr/zephyr.signed.hex {{usage.build}}/mcuboot/zephyr/zephyr.hex -o merged.hex
if [[ -d {{usage.build}}/hci_ipc ]]; then
  cp {{usage.build}}/hci_ipc/zephyr/zephyr.hex merged_CPUNET.hex
fi
'''
["nrf5340:flash:net"]
description = "Flash Network Core FW"
dir = "{{cwd}}"
usage = '''
arg "<hex>"
'''
run = '''
if [[ -f {{usage.hex}} ]]; then
  nrfutil device program --family nrf53 --core Network \
    --options chip_erase_mode=ERASE_ALL  \
    --firmware {{usage.hex}}
fi
'''

["nrf5340:flash:app"]
description = "Flash Application Core FW"
dir = "{{cwd}}"
usage = '''
arg "<mergedhex>" default="merged.hex"
'''
run = '''
nrfutil device program --family nrf53 --core Application \
  --options chip_erase_mode=ERASE_ALL,reset=RESET_NONE,verify=VERIFY_READ \
  --firmware {{usage.mergedhex}}
sleep 2
nrfutil device reset
'''


["nrf5340:flash"]
description = "Flash both Network and Application Core FW"
dir = "{{cwd}}"
usage = '''
flag "-d --build-dir <build_dir>"
flag "--sysbuild" help="Sysbuild"
'''
run = [
  { task = '_artifacts:mergehex', args = [
    '{{usage.build_dir}}',
  ] },
  { task = 'nrf5340:flash:net', args = [
    'merged_CPUNET.hex',
  ] },
  { task = 'nrf5340:flash:app', args = [
    'merged.hex',
  ] },
]


["west:flash:reset"]
description = "Flash both Network and Application Core FW"
dir = "{{cwd}}"
usage = '''
arg "<build_dir>" help="Build Dir"
flag "-s --serial [port]" help="Serial"
'''
run = [
  'west flash -d {{usage.build_dir}}',
  'sleep 2',
  'nrfutil device reset',
  '{%if usage.serial %} scope serial {{usage.serial}} 115200 {% else %}echo "done"{% endif %}',
]
