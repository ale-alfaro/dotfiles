


["global:flash:nrf5340"]
description = "Flash a sysbuild app onto BOTH cores from its merged hexes (net core first), then reset. probe-rs routes each hex by address: app flash at 0x0, net flash at 0x01000000."
dir = "{{cwd}}"
usage = '''
flag "--app <cpuapp_hex>" 
flag "--net <cpunet_hex>"
flag "-s --serial [port]" {
    help "Attach to serial port after flashing"
    env "SERIAL_PORT"
}
'''
run = '''
#!/usr/bin/env zsh
exec_with_recover_and_retry() {
  if ! "$@" 2>&1; then
    echo "Retrying after recovering both cores ..."
    nrfutil device recover --core Network
    nrfutil device recover --core Application
    "$@" 2>&1
  fi
}
program_net() {
  echo "Flashing CPUNET ${usage_net?} ...."
  exec_with_recover_and_retry nrfutil device program --family nrf53 --core Network \
    --options chip_erase_mode=ERASE_ALL,reset=RESET_NONE,verify=VERIFY_READ \
    --firmware ${usage_net?}
}

program_app() {
  echo "Flashing CPUAPP ${usage_app?} ...."
  exec_with_recover_and_retry nrfutil device program --family nrf53 --core Application \
    --options chip_erase_mode=ERASE_ALL,reset=RESET_DEFAULT,verify=VERIFY_READ \
    --firmware ${usage_app}
}
[[ ! -f "${usage_net?}" ]] && { echo "Not found ${usage_net}" >&2; exit 1 }
[[ ! -f "${usage_app?}" ]] && { echo "Not found ${usage_app}" >&2; exit 1 }
program_net
sleep 0.5
program_app
{% if usage.serial %}
sleep 0.5
picocom -g '{{now() | date(format="%R-%m-%d") }}.log' -b 115200 {{usage.serial}} 
{% endif %}
'''

# --- probe-rs: flash/attach/debug over the on-board SWD probe -----------------
# The chip name targets the nRF5340 APP core; probe-rs auto-unlocks a locked
# net core (Core 1) by erasing it when needed. With more than one probe on the
# bench, add: --probe <VID:PID:SERIAL>  (list them with `probe-rs list`).
["global:probe:attach:nrf5340"]
description = "Stream RTT logs from the RUNNING target — no flash, no reset. ELF is only read for RTT symbols."
dir = "{{cwd}}"
usage = 'arg "<elf>" help="ELF of the image currently on the target, e.g. build/datalogger_fw/datalogger_fw/zephyr/zephyr.elf"'
run = 'probe-rs attach --chip nRF5340_xxAA --protocol swd --speed 4000 {{usage.elf}}'

["global:probe:run:nrf5340"]
description = "Flash a NON-sysbuild sample ELF (links at 0x0, e.g. dual_stream) and stream RTT. NEVER for datalogger_fw: its zephyr.elf is unsigned and MCUboot will refuse it — use //:flash:app:nrf5340, then probe:attach."
dir = "{{cwd}}"
usage = 'arg "<elf>" help="e.g. build/dual_stream/zephyr/zephyr.elf"'
run = 'probe-rs run --chip nRF5340_xxAA --protocol swd --speed 4000 --allow-erase-all {{usage.elf}}'

["global:probe:reset:nrf5340"]
description = "Hardware-reset the target and detach"
dir = "{{cwd}}"
hide = true
run = 'probe-rs reset --chip nRF5340_xxAA --protocol swd'

["global:probe:gdb:nrf5340"]
description = "GDB server on :1337. Connect: arm-zephyr-eabi-gdb <elf> -ex 'target remote :1337'"
dir = "{{cwd}}"
hide = true
run = 'probe-rs gdb --chip nRF5340_xxAA --protocol swd --speed 4000'
