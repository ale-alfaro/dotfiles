# :schema https://mise.jdx.dev/schema/mise.json
[settings]
experimental = true
lockfile = true
color_theme = "auto"
unix_default_file_shell_args = 'zsh -eu'
unix_default_inline_shell_args = "zsh -eu -c"
trusted_config_paths = [
        '~/sibel/eng/fw/anne-workspace',
        "~/sibel/Documents/Obsidian",
        "~/dotfiles/",
]
disable_backends = ["asdf"]
disable_tools = ["pipx:west"]
always_keep_download = false # deleted after install by default
always_keep_install = false # deleted on failure by default
status = { missing_tools = "if_other_versions_installed", show_env = true, show_tools = true }
task = { output = "interleave", run_auto_install = true, timings = true, show_full_cmd = true, source_freshness_hash_contents = true }
npm.package_manager = "bun"
npm.bun = true
pipx.uvx = true
python.uv_venv_auto = "create|source"
github.gh_cli_tokens = true
cargo.binstall_native = true
cargo.binstall = true
color = true


[tools]
uv = "latest"
python = ["3.12.9", "3.10.22"]
rg = "latest"
jqp = "latest"
lua = "5.5"
dprint = "latest"
lua-language-server = "latest"
stylua = "latest"
lazygit = "latest"
claude-code = "latest"
cmake = "latest"
tree-sitter = "latest"
ast-grep = "latest"
tmux = "latest"
ccache = "latest"
neovim = "latest"
marksman = "latest"
shfmt = "latest"
shellcheck = "latest"
jq = "latest"
difftastic = "latest"
yq = "latest"
actionlint = "latest"
sd = "latest"
pkl = "latest"
ninja = "latest"
clang-format = "latest"
fzf = "latest"
codex = "latest"
rumdl = "latest"
protoc = "latest"
gitui = "latest"

"packslip:github.com/max-sixty/worktrunk" = "latest"
"packslip:jdx/hk" = "latest"
"packslip:jdx/usage" = "latest"

node = "lts"
bun = "latest"
"npm:bash-language-server" = "latest"
"npm:yaml-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:defuddle" = "latest"

gh = "latest"
git-lfs = "latest"
"github:clangd/clangd" = "latest"
"github:joshmedeski/sesh" = "latest"
"github:dlvhdr/diffnav" = "latest"
"github:dandavison/delta" = "latest"
"github:apple/pkl-lsp" = "latest"

go = "latest"

rust = "latest"
rust-analyzer = "latest"
cargo-binstall = "latest"
"cargo:neocmakelsp" = "latest"
"cargo:atuin" = "latest"
"cargo:taplo-cli" = { version = "latest", features = "lsp" }
"cargo:tealdeer" = { version = "latest", fetures = "native-tls" }

"http:nrfutil" = { version = "1.4.0", url = "https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/x86_64-unknown-linux-gnu/nrfutil" }
"vfox-zephyr:west" = "latest"
"vfox-zephyr:arm" = "latest"

[plugins]
"vfox:zephyr" = "https://github.com/ale-alfaro/vfox-zephyr-sdk.git"
