
[settings]
experimental = true
python.uv_venv_auto = "create|source"
# unix_default_file_shell_args = 'zsh -uc'
unix_default_inline_shell_args = 'zsh -uc'
trusted_config_paths = ['~/sibel/eng/fw', '~/sibel/eng/tools']
verbose = false                                                # set to true to see full installation output, see `MISE_VERBOSE`
http_timeout = "30s"                                           # set the timeout for http requests as duration string, see `MISE_HTTP_TIMEOUT`
jobs = 4                                                       # number of plugins or runtimes to install in parallel. The default is `4`.
yes = false                                                    # set to true to automatically answer yes to all prompts
not_found_auto_install = true                                  # see MISE_NOT_FOUND_AUTO_INSTALL
task_output = "prefix"                                         # see Tasks Runner for more information
env_shell_expand = true
use_file_shell_for_executable_tasks = true
task.show_full_cmd = false

[settings.status]
missing_tools = "if_other_versions_installed"
show_env = true
show_tools = true

[tools]
python = ["3.12", "3.13", "3.14"]
uv = "latest"
usage = "latest"
atuin = "latest"
claude-code = "latest"
cmake = "latest"
codex = "latest"
starship = "latest"
tree-sitter = "latest"
node = "latest"
ast-grep = "latest"
tmux = "latest"
ccache = "latest"
taplo = "latest"
yq = "latest"
"github:alltuner/mise-completions-sync" = "latest"
"pipx:docling" = "latest"
"pipx:ptpython" = "latest"
"pipx:pudb" = "latest"
"pipx:pyrefly" = "latest"
"pipx:ruff" = "latest"
"pipx:ty" = "latest"
"npm:prettier" = "latest"
"npm:bash-language-server" = "latest"
"npm:yaml-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"pipx:cmakelang" = { version = "latest", extras = "yaml,html-gen" }
"pipx:clang-format" = "latest"
"http:acli" = { version = "latest", url = "https://acli.atlassian.com/linux/latest/acli_linux_amd64/acli" }
"cargo:neocmakelsp" = "latest"
"pipx:gersemi" = "latest"
"pipx:prek" = "latest"
"pipx:commitizen" = "latest"
"pipx:west" = "latest"
marksman = "latest"
lazygit = "latest"
typst = "latest"
typstyle = "latest"
tinymist = "latest"

[shell_alias]
pygdb = "PYTHONHOME=/usr /opt/zephyr-sdk-custom/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb-py -ex 'target remote :2331'"
jdbserver = "JLinkGDBServer -device NRF52840_XXAA -if SWD -speed 4000 -port 2331 -silent -singlerun"
