[task_templates."twister:testplan"]
description = "Save a testplan to a json file"
dir = "{{cwd}}"
vars.testplan_flag = "--save-tests"
usage = '''
arg "<platform>" {
  help "Platform"
  env "TWISTER_PLATFORM"
}
arg "<dir>" {
  help "Testsuite root"
  env "TWISTER_TESTSUITE_ROOT"
  default "."
}
flag "-t --testplan <testplan>" {
  help "Test plan json file"
  default "testplan.json"
}
arg "[extra_args]" {
  help "Extra args for twister"
  var #true
}
'''
run = '''
west twister -c --detailed-test-id {{ usage.extra_args | join(sep=" ") }} -p {{usage.platform}} -T {{usage.dir}} {{vars.testplan_flag}} {{usage.testplan}}
'''

[task_templates."twister:run"]
description = "Run twister"
dir = "{{cwd}}"
usage = ''' 
arg "<dir>" {
    help "Twister testsuite"
}
arg "[varargs]" {
    help "Arguments and flags to pass to twister with or without '--'"
    double_dash "automatic"
    var #true
}
flag "-b --board [board]" {
    help "Twister platform (board) to run. Set also by TWISTER_BOARD"
    env "TWISTER_BOARD"
}
flag "--flash-script [flash_script]" {
    long_help """
        Flash script to be used instead of `west flash`
        HIGHLY recommended for sysbuild multi-image builds
        west flash does a poor job flashing multiple images
        and will leave the device halted on boot-up
    """
}
flag "-s --serial-port [port]" {
    help "Twister serial port"
    default "/dev/ttyACM0"
    env "TWISTER_SERIAL_PORT"
}
flag "-o --outdir [outdir]" {
    help "Output dir. twister-out is the default"
}
flag "-n --no-clean" {
    long_help """
    Do not clean the twister-out dir and re-compile the build artifacts
    Default behavior is to clobber the directories every run
    """
} 
'''

[tasks."_postbuild:symlink:compdb"]
hide = true
dir = "{{cwd}}"
usage = 'arg "<build>"'
run = '''

if [[ -f "${usage_build?}/compile_commands.json" ]]; then
  compdb="${usage_build}/compile_commands.json"
elif [[ -f "${usage_build?}/domains.yaml" ]]; then
  compdb="${usage_build}/$(yq e '.default' $usage_build/domains.yaml)/compile_commands.json"
else
  echo "No compile_commands.json found in ${usage_build}"
  exit 1
fi
topdir="$(west topdir)"
echo "Linking compdb $compdb to $topdir"
ln -sf "$compdb" "$topdir"
'''
