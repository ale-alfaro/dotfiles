#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json
blacklist = ["build"]
sort_order = ["tmux", "config", "zoxide"]

[tui]
prompt = "> "
placeholder = "Filter sessions... "
show_icons =  true
show_windows = true
alias_auto_connect_delay = "150ms"
alias_filter_prefix = "/"
preview = true
preview_width = 60
preview_min_width = 100
preview_border = "line"

[default_session]
preview_command = "eza --all --git --icons --color=always {}"
startup_command = "nvim ."

[[session]]
name = "Common Config"
path = "~/dotfiles/common/.config"

[[session]]
name = "Obsidian"
path = "~/Documents/Obsidian"
startup_command = "tdl claude"

[[session]]
name = "Aria (v2)"
path = "~/sibel/eng/fw/aria_workspace"
startup_command = "tdl claude"

[[session]]
name = "Vfox Plugin"
path = "~/sibel/eng/tools/vfox-zephyr-sdk"
startup_command = "mise deactivate"


[[session]]
name = "Aria Legacy (v1)"
path = "~/sibel/eng/fw/aria-legacy-workspace"
startup_command = "tdl claude"


[[session]]
name = "Tools"
path = "~/sibel/eng/tools"
startup_command = "eza --absolute | fzf |  xargs -ro nvim"
