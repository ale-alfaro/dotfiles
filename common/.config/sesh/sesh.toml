#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json
blacklist = [".config", "build", "scratch"]
sort_order = ["tmux", "config", "zoxide"]

[tui]
prompt = "> "
placeholder = "Filter sessions... "
show_icons = true
show_windows = true
alias_auto_connect_delay = "150ms"
alias_filter_prefix = "/"
preview = true
preview_width = 60
preview_min_width = 100
preview_border = "line"

[default_session]
preview_command = "eza --all --git --icons --color=always {}"
startup_command = '''
nvim -c ":lua require('fzf-lua').oldfiles({ cwd_only = function() return vim.api.nvim_command('pwd') ~= vim.env.HOME end })"
'''
tmuxp = ""

[[session]]
name = "Common Config"
path = "~/dotfiles/common/.config"

[[session]]
name = "Obsidian"
path = "~/Documents/Obsidian"

[[session]]
name = 'aria'
path = "~/sibel/eng/fw/aria-workspace-releases"
preview_command = "west -q list -f '{name}': '{path}'"
startup_command = 'tdl claude'

[[window]]
name = "claude"
startup_script = "claude --resume"

[browser]
application = "zen"
