# $schema : https://gh-dash.dev/schema.json
#
prSections:
  - title: Sibel Subscribed
    filters: >-
      is:open repo:sibelhealth/sh_sdk_2.0
      is:open repo:sibelhealth/aria-sense-fw
      updated:>={{ nowModify "-2.5w" }}
    layout:
      repo:
        hidden: true
  - title: Mine
    filters: >-
      is:open author:@me
      updated:>={{ nowModify "-3w" }} 
      sort:updated-desc
    layout:
      author:
        hidden: true
  - title: Review
    filters: >-
      is:open review-requested:@me
      updated:>={{ nowModify "-2.5w" }}
issuesSections:
  - title: Creator
    filters: author:@me
  - title: Assigned
    filters: is:open assignee:@me

pager:
  diff: diffnav

showAuthorIcons: true
smartFilteringAtLaunch: false

defaults:
  view: prs
  refetchIntervalMinutes: 10
  layout:
    prs:
      repoName:
        grow: true
        width: 10
        hidden: false
      base:
        hidden: true
  preview:
    open: true
    width: 80
  prsLimit: 5
  issuesLimit: 5

repoPaths:
  ale-alfaro/*: ~/sibel/eng/tools/*
  sibelhealth/DragonFly-Zephyr: ~/sibel/eng/fw/anne_sensors_workspace/dragonfly
  sibelhealth/BengalTiger-Zephyr: ~/sibel/eng/fw/anne_sensors_workspace/bengal
  sibelhealth/framework: ~/sibel/eng/fw/anne_sensors_workspace/framework
  sibelhealth/sh_sdk_2.0: ~/sibel/eng/fw/aria_workspace/sh_sdk
  ale-alfaro/dotfiles: ~/dotfiles

keybindings:
  universal:
    - key: g
      name: lazygit
      command: >
        cd {{.RepoPath}} && lazygit
  prs:
    - key: a
      name: Add Reviewer
      command: >-
        gh pr edit --add-reviewer sibelhealth/Firmware
    - key: T
      name: runs watch
      command: >-
        tmux neww -n "enhance {{.PrNumber}}" 'gh enhance -R {{.RepoName}} {{.PrNumber}}'
    - key: O
      name: claude review
      command: >-
        tmux neww -c {{.RepoPath}} 'claude "review pr#{{.PrNumber}}"'
    - key: v
      name: approve
      command: >
        gh pr review --repo {{.RepoName}} --approve --body "$(gum input --prompt='Approval Comment: ')" {{.PrNumber}}
    - key: W
      name: Run Workflow
      command: >
        gh workflow run "$(gh workflow list --json path --jq '.' | jq -r
        '.[].path | ltrimstr(".github/workflows/")' | fzf)"
        --ref={{.HeadRefName}}

  notifications:
    - key: d
      builtin: markAsDone
    - key: D
      builtin: markAllAsDone
theme:
  ui:
    sectionsShowCount: true
    table:
      compact: false
      showSeparator: true
  colors:
    text:
      primary: "#E2E1ED"
      secondary: "#666CA6"
      inverted: "#242347"
      faint: "#B0B3BF"
      warning: "#E0AF68"
      error: "#DB4B4B"
      success: "#3DF294"
    background:
      selected: "#1B1B33"
    border:
      primary: "#383B5B"
      secondary: "#39386B"
      faint: "#2B2B40"
