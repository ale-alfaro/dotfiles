# haiku.rag configuration file
# See https://ggozad.github.io/haiku.rag/configuration/ for details

environment: production
storage:
  data_dir: ''
  vacuum_retention_seconds: 86400
monitor:
  directories: []
  ignore_patterns: []
  include_patterns: []
lancedb:
  uri: ''
  api_key: ''
  region: ''
embeddings:
  provider: ollama
  model: qwen3-embedding:4b
  vector_dim: 2560
reranking:
  provider: ''
  model: ''
qa:
  provider: ollama
  model: gpt-oss
research:
  provider: ''
  model: ''
processing:
  chunk_size: 256
  context_chunk_radius: 0
  markdown_preprocessor: ''
providers:
  ollama:
    base_url: http://localhost:11434
  vllm:
    embeddings_base_url: ''
    rerank_base_url: ''
    qa_base_url: ''
    research_base_url: ''
agui:
  host: 0.0.0.0
  port: 8000
  cors_origins:
  - '*'
  cors_credentials: true
  cors_methods:
  - GET
  - POST
  - OPTIONS
  cors_headers:
  - '*'
