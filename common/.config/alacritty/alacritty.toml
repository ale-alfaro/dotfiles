# general.import = [ "~/.config/hypr/current/theme/alacritty.toml" ]
general.import = [ "~/.config/alacritty/themes/omarchy_tokio_night.toml" ]

[env]
TERM = "xterm-256color"

[window]
padding.x = 10
padding.y = 10

decorations = "Buttonless"

opacity = 0.7
blur = true

option_as_alt = "Both"

# [font]
# normal.family = "MesloLGS Nerd Font Mono"

[font]
normal = { family = "Adwaita Mono" }
bold = { family = "Adwaita Mono" }
italic = { family = "Adwaita Mono" }

# size = 9
size = 18

