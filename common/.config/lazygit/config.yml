# Copied from https://github.com/folke/tokyonight.nvim/blob/main/extras/lazygit/tokyonight_night.conf
gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#ff9e64"
      - "bold"
    inactiveBorderColor:
      - "#27a1b9"
    searchingActiveBorderColor:
      - "#ff9e64"
      - "bold"
    optionsTextColor:
      - "#7aa2f7"
    selectedLineBgColor:
      - "#283457"
    cherryPickedCommitFgColor:
      - "#7aa2f7"
    cherryPickedCommitBgColor:
      - "#bb9af7"
    markedBaseCommitFgColor:
      - "#7aa2f7"
    markedBaseCommitBgColor:
      - "#e0af68"
    unstagedChangesColor:
      - "#db4b4b"
    defaultFgColor:
      - "#c0caf5"
customCommands:
  - key: 'C'
    command: 'git commit -m {{.Form.CommitMsg| quote}}'
    context: 'global'
    prompts:
      - type: 'input'
        title: 'Msg:'
        key: 'CommitMsg'
        initialValue: 'username/{{ runCommand "date +\"%Y/%-m\"" }}/'
