# Copied from https://github.com/folke/tokyonight.nvim/blob/main/extras/lazygit/tokyonight_night.conf
gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#ff9e64"
      - "bold"
    inactiveBorderColor:
      - "#27a1b9"
    searchingActiveBorderColor:
      - "#ff9e64"
      - "bold"
    optionsTextColor:
      - "#7aa2f7"
    selectedLineBgColor:
      - "#283457"
    cherryPickedCommitFgColor:
      - "#7aa2f7"
    cherryPickedCommitBgColor:
      - "#bb9af7"
    markedBaseCommitFgColor:
      - "#7aa2f7"
    markedBaseCommitBgColor:
      - "#e0af68"
    unstagedChangesColor:
      - "#db4b4b"
    defaultFgColor:
      - "#c0caf5"

customCommands:
  # 1) Quick commit with dynamic prefix username/YYYY/M/
  - key: "Y"
    description: "Commit: prefix username/YYYY/M/"
    context: global
    output: terminal
    prompts:
      - type: input
        title: "Msg:"
        key: CommitMsg
        initialValue: ""
    command: |
      #!/usr/bin/env bash
      set -euo pipefail

      prefix="username/$(date +%Y/%-m)/"
      msg="{{ .Form.CommitMsg }}"

      if [[ -z "$msg" ]]; then
        echo "Error: empty commit message"
        exit 1
      fi

      if [[ "$msg" == username/* ]]; then
        final="$msg"
      else
        final="${prefix}${msg}"
      fi

      git commit -m "$final"

  # 3) Author + date range log (since/until prompts)
  - key: "U"
    description: "Log: author + date range (pretty)"
    context: global
    output: terminal
    prompts:
      - type: input
        title: "Author (name/email/regex):"
        key: Author
        suggestions:
          preset: authors
      - type: input
        title: "Since (blank = no lower bound):"
        key: Since
        initialValue: "2 weeks ago"
      - type: input
        title: "Until (blank = now):"
        key: Until
        initialValue: ""
    command: |
      #!/usr/bin/env bash
      set -euo pipefail

      author="{{ .Form.Author }}"
      since="{{ .Form.Since }}"
      until="{{ .Form.Until }}"

      args=()
      [[ -n "$since" ]] && args+=(--since="$since")
      [[ -n "$until" ]] && args+=(--until="$until")

      git log --author="$author" "${args[@]}" \
        --graph --decorate --date=short \
        --pretty=format:'%C(auto)%h%d%Creset %C(blue)%ad%Creset %C(green)%an%Creset %s' \
      | less -FRX

  # 4) Selected file history with --follow + optional date range (run from files panel)
  - key: "H"
    description: "File history: --follow + date range (selected file)"
    context: files
    output: terminal
    prompts:
      - type: input
        title: "Since (blank = no lower bound):"
        key: Since
        initialValue: "1 month ago"
      - type: input
        title: "Until (blank = now):"
        key: Until
        initialValue: ""
    command: |
      #!/usr/bin/env bash
      set -euo pipefail

      file="{{ .SelectedFile.Name }}"
      since="{{ .Form.Since }}"
      until="{{ .Form.Until }}"

      if [[ -z "$file" ]]; then
        echo "Error: no selected file"
        exit 1
      fi

      args=()
      [[ -n "$since" ]] && args+=(--since="$since")
      [[ -n "$until" ]] && args+=(--until="$until")

      git log --follow "${args[@]}" \
        --graph --decorate --oneline \
        -- "$file" \
      | less -FRX

  # 5) Pickaxe (-S) diff-content search + optional path + optional dates
  - key: "S"
    description: "Search diffs: pickaxe (-S exact string), optional path"
    context: global
    output: terminal
    prompts:
      - type: input
        title: "Exact string to search in diffs (-S):"
        key: Needle
        initialValue: ""
      - type: input
        title: "Limit to path (blank = whole repo):"
        key: Path
        initialValue: ""
      - type: input
        title: "Since (blank = no lower bound):"
        key: Since
        initialValue: ""
      - type: input
        title: "Until (blank = now):"
        key: Until
        initialValue: ""
    command: |
      #!/usr/bin/env bash
      set -euo pipefail

      needle="{{ .Form.Needle }}"
      path="{{ .Form.Path }}"
      since="{{ .Form.Since }}"
      until="{{ .Form.Until }}"

      if [[ -z "$needle" ]]; then
        echo "Error: needle is empty"
        exit 1
      fi

      args=()
      [[ -n "$since" ]] && args+=(--since="$since")
      [[ -n "$until" ]] && args+=(--until="$until")

      if [[ -n "$path" ]]; then
        git log -S"$needle" "${args[@]}" \
          --graph --decorate --date=short \
          --pretty=format:'%C(auto)%h%d%Creset %C(blue)%ad%Creset %C(green)%an%Creset %s' \
          -- "$path" \
        | less -FRX
      else
        git log -S"$needle" "${args[@]}" \
          --graph --decorate --date=short \
          --pretty=format:'%C(auto)%h%d%Creset %C(blue)%ad%Creset %C(green)%an%Creset %s' \
        | less -FRX
      fi

  # 6) Regex-in-diff search (-G) + optional path + optional dates
  - key: "R"
    description: "Search diffs: regex (-G), optional path"
    context: global
    output: terminal
    prompts:
      - type: input
        title: "Regex to search in diffs (-G):"
        key: Regex
        initialValue: ""
      - type: input
        title: "Limit to path (blank = whole repo):"
        key: Path
        initialValue: ""
      - type: input
        title: "Since (blank = no lower bound):"
        key: Since
        initialValue: ""
      - type: input
        title: "Until (blank = now):"
        key: Until
        initialValue: ""
    command: |
      #!/usr/bin/env bash
      set -euo pipefail

      regex="{{ .Form.Regex }}"
      path="{{ .Form.Path }}"
      since="{{ .Form.Since }}"
      until="{{ .Form.Until }}"

      if [[ -z "$regex" ]]; then
        echo "Error: regex is empty"
        exit 1
      fi

      args=()
      [[ -n "$since" ]] && args+=(--since="$since")
      [[ -n "$until" ]] && args+=(--until="$until")

      if [[ -n "$path" ]]; then
        git log -G"$regex" "${args[@]}" \
          --graph --decorate --date=short \
          --pretty=format:'%C(auto)%h%d%Creset %C(blue)%ad%Creset %C(green)%an%Creset %s' \
          -- "$path" \
        | less -FRX
      else
        git log -G"$regex" "${args[@]}" \
          --graph --decorate --date=short \
          --pretty=format:'%C(auto)%h%d%Creset %C(blue)%ad%Creset %C(green)%an%Creset %s' \
        | less -FRX
      fi
