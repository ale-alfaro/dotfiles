# Set the prefix to Ctrl+a
set -g prefix C-a
# set -g prefix C-SPACE
# Remove the old prefix
unbind C-b
# Send Ctrl+a to applications by pressing it twice
bind C-a send-prefix

# for debugging
set -g remain-on-exit "off"

bind r source-file "~/.config/tmux/tmux.conf"
# bind f run "tmux neww ~/.config/scripts/tmux-session-dispensary.sh"
# bind O run "tmux neww ~/.config/scripts/open-pdf.sh"
# bind g run "~/.config/scripts/open-github.sh"
# bind W run "~/.config/tmux/tmux-session-dispensary.sh ~/sibel/eng/fw"
# bind T run "~/.config/tmux/tmux-session-dispensary.sh ~/sibel/eng/tools"
# bind o run "~/.config/tmux/tmux-session-dispensary.sh ~/Documents/Obsidian"
# bind D run "~/.config/tmux/tmux-session-dispensary.sh ~/dotfiles"
# bind H run "~/.config/tmux/tmux-session-dispensary.sh ~"
bind G neww -n "git" -S lazygit
bind E show-environment -g

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin "tmux-plugins/tmux-battery"
set -g @plugin "olimorris/tmux-pomodoro-plus"
set -g @plugin "wabri/tmux-nord-plusplus"
# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
