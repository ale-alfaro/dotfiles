[tools]
"cargo:emmylua_formatter" = "latest"
"cargo:emmylua_ls" = "latest"
stylua = "latest"

# --- CHECKS ---


[tasks.check]
description = "Run Neovim health check"
run = "nvim --headless -c 'checkhealth' -c '5sleep' -c 'qall'"

# --- FORMATTING ---

[tasks.format]
description = "Format all Lua files with stylua"
run = "luafmt . --write"
