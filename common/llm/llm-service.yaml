configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:8080"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  # Tailscale Sidecar
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-${SERVICE}
    hostname: ${SERVICE}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_AUTH_ONCE=true
      - TS_ACCEPT_DNS=true
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - ./config:/config
      - ./ts/state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always

  # llama.cpp server (CUDA)
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    network_mode: service:tailscale
    container_name: app-${SERVICE}
    user: "1000:1000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - HF_HOME=/cache/huggingface
      # Populated per-variant from presets.ini via scripts/preset-to-env.py.
      # Bare passthroughs: unset vars are simply omitted from the container.
      - LLAMA_ARG_CTX_SIZE
      - LLAMA_ARG_N_GPU_LAYERS
      - LLAMA_ARG_FLASH_ATTN
      - LLAMA_ARG_CACHE_TYPE_K
      - LLAMA_ARG_CACHE_TYPE_V
      - LLAMA_ARG_JINJA
      - LLAMA_ARG_BATCH
      - LLAMA_ARG_UBATCH
      - LLAMA_ARG_N_PARALLEL
      - LLAMA_ARG_N_CPU_MOE
      - LLAMA_ARG_REASONING
      - LLAMA_ARG_NO_MMAP
    volumes:
      - ${HOME}/.cache/huggingface:/cache/huggingface
    command: >
      -hf ${HF_REPO:?HF_REPO must be set — run via "mise run <variant>"}
      --host 0.0.0.0
      --port 8080
    depends_on:
      tailscale:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "llama-server"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always
