[tools]
typst = "latest"
tinymist = "latest"
typstyle = "latest"

[tasks."cv:compile"]
description = "Compile"
run = 'typst compile src/resume.typ "build/DRAFT-Alejandro-Alfaro-CV-$(date +%Y-%m-%d).pdf"'


[tasks."cv:check"]
depends = ["cv:compile"]
description = "verify (single page, metadata, links, text layer)"
run = "uv run --script scripts/release.py"

[tasks."cv:release"]
depends = ["cv:check"]
description = "verify (single page, metadata, links, text layer)"
run = 'mv "build/DRAFT-Alejandro-Alfaro-CV-$(date +%Y-%m-%d).pdf" artifacts/Alejandro-Alfaro-CV-$(date +%Y-%m-%d).pdf'

